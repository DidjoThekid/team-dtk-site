<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Team DTK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0f;--card:#161922;--line:#262a35;--txt:#f4f5f7;--mut:#9aa0ad;--acc:#d8ff2d;--bad:#ff5a5a;--ok:#2bd98a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;margin:0}h2{font-size:1.6rem;margin-bottom:.3rem}
.wrap{max-width:980px;margin:0 auto;padding:1.2rem}
.bar{position:sticky;top:0;z-index:5;background:#0a0b0fee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 1.2rem}.bar h1{font-size:1.5rem;margin-right:auto}h1 span{color:var(--acc)}
button,.lnk{font:inherit;font-weight:700;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--txt);padding:.5rem 1.1rem;cursor:pointer;text-decoration:none;display:inline-block}
button.pri{background:var(--acc);border-color:var(--acc);color:#0a0b0f}button.pri:disabled{opacity:.5;cursor:wait}
button.del{border-color:#5a2a2a;color:var(--bad)}button.sm{padding:.25rem .7rem;font-size:.85rem}
#status{font-size:.85rem;color:var(--mut)}#status.ok{color:var(--ok)}#status.err{color:var(--bad)}
section{margin:2rem 0}.hint{color:var(--mut);margin:0 0 1rem;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.9rem}
.card.unsaved{border-color:var(--acc)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem}.row .wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:.25rem;font-size:.8rem;color:var(--mut);font-weight:600}
.f input,.f textarea,.f select{font:inherit;background:#0e1016;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;width:100%}
.f textarea{min-height:70px;resize:vertical}.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--acc);border-color:transparent}
.chk{display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--txt);font-weight:500}.chk input{width:18px;height:18px;accent-color:var(--acc)}
.tools{display:flex;gap:.5rem;align-items:center;margin-top:.8rem;flex-wrap:wrap}.tools .sp{margin-left:auto}
.pill{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-size:.78rem;font-weight:700;background:#222633;color:var(--mut)}.pill.live{background:var(--acc);color:#0a0b0f}
.warn{background:#3a2a10;border:1px solid #7a5a1a;color:#ffd98a;border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem}
.login{max-width:380px;margin:18vh auto;text-align:center}.login .f{text-align:left;margin:1rem 0}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.themes label{border:2px solid var(--line);border-radius:12px;padding:.7rem;cursor:pointer;display:flex;gap:.5rem;align-items:center;font-weight:600}
.themes input{accent-color:var(--acc)}.themes label:has(input:checked){border-color:var(--acc);background:#1b1f2a}
.seg{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}.seg label{flex:1;min-width:240px;border:2px solid var(--line);border-radius:12px;padding:.8rem 1rem;cursor:pointer}
.seg label:has(input:checked){border-color:var(--acc);background:#1b1f2a}.seg b{display:block}.seg span{color:var(--mut);font-size:.85rem}
</style>
</head>
<body>
<div id="root"></div>
<script src="/admin.js"></script>
</body>
</html>
